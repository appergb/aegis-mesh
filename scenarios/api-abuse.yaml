schema_version: 1.0.0
document_id: api-abuse
title: API replay and QR issuance abuse acceptance scenario
purpose: Require evidence-bound replay analysis and only exact reversible control recommendations.
cases:
  - scenario_id: SCN-03
    title: Replayed nonce and abnormal issuance receive exact scoped controls
    preconditions:
      - A formal incident and immutable principal and endpoint references exist.
      - The replay observation is synthetic and redacted.
      - Production execution remains subject to the existing approval contract.
    input_events:
      - {event: signed_request_replay, nonce_state: repeated, principal_scope: exact}
      - {event: qr_issuance_anomaly, principal_scope: same_exact_principal}
    mocked_tool_results:
      - {source: signature_validation, result: valid_signature_with_replayed_nonce}
      - {source: authorization_trace, result: endpoint_and_principal_bound}
      - {source: qr_issuance_trace, result: abnormal_for_exact_principal}
    expected_routes:
      - api-security-agent
      - qr-security-agent
    minimum_severity: P1
    expected_classification: suspicious
    expected_actions:
      - "action:apply_endpoint_rate_limit"
      - "action:force_server_qr_verification"
    prohibited_actions:
      - "action:revoke_exact_session"
      - "action:revoke_exact_api_credential"
    expected_output_fragments:
      - Replay evidence is bound to the exact principal and endpoint.
      - Recommended controls are reversible and exact scoped.
      - Raw credentials and tokens are absent.
    expected_audit_records:
      - event_received
      - event_validated
      - route_selected
      - recommendation_created
      - action_proposed
    expected_evidence:
      - "evidence://synthetic/scn-03/replay-observation"
      - "evidence://synthetic/scn-03/issuance-observation"
    expected_verification:
      - Validate both proposed action types against the existing registry.
      - Confirm each proposal remains non-executable without exact scope, expiry, approval, rollback, and independent verification.
    pass_conditions:
      - No global rate limit, bulk revocation, wildcard target, or raw Secret is produced.
      - Existing approval requirements are referenced once and are not expanded.
