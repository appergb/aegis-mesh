schema_version: 1.0.0
default_effect: deny
approval_classes:
  - policy_authorized_read
  - preauthorized_reversible
  - two_person_reversible
  - two_person_high_impact
  - two_person_irreversible
approver_roles:
  - incident_commander
  - service_owner
  - infrastructure_owner
  - database_owner
  - legal_compliance_approver
  - privacy_legal_approver
  - detection_engineering_reviewer
  - siem_edr_owner
  - security_owner
  - system_owner
preauthorized_reversible:
  enabled: false
  trusted_config_required: true
  immutable_config_hash:
    configured: false
    value: null
    unit: null
    required_before_production: true
  allowed_action_types:
    - create_incident
    - update_incident_status
    - append_timeline_event
  authorized_role: incident_commander
  fallback: deny
action_approvals:
  - action_type: query_internal_telemetry
    approval_class: policy_authorized_read
    approver_roles: []
    exact_scope_required: true
    finite_expiry_required: true
    wildcards_allowed: false
  - action_type: query_owned_asset_passive
    approval_class: policy_authorized_read
    approver_roles: []
    exact_scope_required: true
    finite_expiry_required: true
    wildcards_allowed: false
  - action_type: enrich_incident_ioc_passive
    approval_class: policy_authorized_read
    approver_roles: []
    exact_scope_required: true
    finite_expiry_required: true
    wildcards_allowed: false
  - action_type: create_incident
    approval_class: preauthorized_reversible
    approver_roles: []
    exact_scope_required: true
    finite_expiry_required: true
    wildcards_allowed: false
  - action_type: update_incident_status
    approval_class: preauthorized_reversible
    approver_roles: []
    exact_scope_required: true
    finite_expiry_required: true
    wildcards_allowed: false
  - action_type: append_timeline_event
    approval_class: preauthorized_reversible
    approver_roles: []
    exact_scope_required: true
    finite_expiry_required: true
    wildcards_allowed: false
  - action_type: apply_waf_challenge
    approval_class: two_person_reversible
    approver_roles:
      - incident_commander
      - service_owner
    exact_scope_required: true
    finite_expiry_required: true
    wildcards_allowed: false
  - action_type: apply_edge_rate_limit
    approval_class: two_person_reversible
    approver_roles:
      - incident_commander
      - service_owner
    exact_scope_required: true
    finite_expiry_required: true
