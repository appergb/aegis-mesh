name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-validation.lock
      - run: python -m pytest -q
      - run: python scripts/validate_package.py --root . --format text
      - run: python -m pytest -q tests/test_forward_results.py
      - run: python scripts/build_release.py
      - run: python scripts/build_release.py --verify
      - run: git diff --check
