name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-validation.lock
      - run: python -m pytest -q
      - run: python scripts/validate_package.py --root . --format text
      - run: python -m pytest -q tests/test_forward_results.py
      - run: python scripts/build_release.py
      - run: python scripts/build_release.py --verify
      - run: git diff --check
