name: Release source bundles

on:
  push:
    tags: ["v*"]

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
      - run: python scripts/check_release_tag.py --tag "$GITHUB_REF_NAME"
      - run: python -m pip install --require-hashes -r requirements-validation.lock
      - run: python -m pytest -q
      - run: python scripts/validate_package.py --root . --format text
      - run: python -m pytest -q tests/test_forward_results.py
      - run: python scripts/check_whitespace.py

  release:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - run: python scripts/check_release_tag.py --tag "$GITHUB_REF_NAME"
      - run: python scripts/build_release.py
      - run: python scripts/build_release.py --verify
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
